<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>うーさ 都道府県代表｜共有リンク</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif;background:#dcf9f0;color:#24554f;margin:0;padding:25px}main{max-width:560px;margin:8vh auto;background:white;border:2px solid #88dccb;border-radius:18px;padding:25px;box-shadow:0 8px 28px #126b5622}h1{font-size:22px;color:#16877b}button{background:#e85ba3;color:white;border:0;border-radius:10px;padding:14px 18px;font-size:17px;font-weight:bold;width:100%;margin:12px 0}p{line-height:1.7}small{color:#667}a{color:#087f75}#out{overflow-wrap:anywhere;font-size:13px}</style></head><body><main><h1>うーさ🐰🌺枠｜閲覧リンク</h1><p id="status">接続情報を確認しています。</p><button id="copy" hidden>閲覧リンクをコピー</button><p id="out"></p><p><a href="./index.html">都道府県代表マップに戻る</a></p><small>公開用Supabaseキーのみを共有します。編集者のメール・パスワードは共有しません。</small></main><script>
const $=id=>document.getElementById(id);const params=new URLSearchParams(location.hash.slice(1));const u=params.get('u'),k=params.get('k');if(u&&k){if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(u)||!(/^(sb_publishable_|eyJ)/.test(k))){$('status').textContent='共有リンクの接続情報が正しくありません。'}else{localStorage.setItem('usaUrl',u.replace(/\/$/,''));localStorage.setItem('usaKey',k);location.replace('./index.html');}}else{const url=localStorage.getItem('usaUrl'),key=localStorage.getItem('usaKey');if(url&&key){const share=new URL('./viewer.html',location.href);share.hash=new URLSearchParams({u:url,k:key}).toString();$('status').textContent='この端末の同期設定を使って、ログイン不要の閲覧リンクを作成できます。';$('copy').hidden=false;$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(share.href);$('status').textContent='閲覧リンクをコピーしました。'}catch{$('out').textContent=share.href;$('status').textContent='下のリンクを長押ししてコピーしてください。'}};}else{$('status').textContent='この端末には同期設定がありません。管理者としてindex.htmlで同期接続してから、このページを開いてください。'}}
</script></body></html>
